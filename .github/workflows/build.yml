name: build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: 플랫폼 폴더 생성
        run: |
          flutter create --platforms=android,windows --project-name mail_chat --org com.example .
          rm -f test/widget_test.dart
      - name: 인터넷 권한 추가
        run: sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: 최소 SDK 23 (보안 저장소 요구사항)
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i -E 's/minSdk(Version)?[ =]+flutter\.minSdkVersion/minSdk = 23/' "$f"
            grep -n "minSdk" "$f" || true
          done
      - run: flutter pub get
      - name: 앱 아이콘 생성 (실패해도 빌드는 계속)
        continue-on-error: true
        run: dart run flutter_launcher_icons
      - name: APK 빌드
        run: flutter build apk --release --no-shrink
      - name: 버전 읽기
        id: ver
        shell: bash
        run: echo "v=$(grep '^version:' pubspec.yaml | sed -E 's/version:[ ]*//; s/\+.*//')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: mailchat-android-v${{ steps.ver.outputs.v }}
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: 플랫폼 폴더 생성
        shell: bash
        run: |
          flutter create --platforms=android,windows --project-name mail_chat --org com.example .
          rm -f test/widget_test.dart
      - run: flutter pub get
      - name: 앱 아이콘 생성 (실패해도 빌드는 계속)
        continue-on-error: true
        run: dart run flutter_launcher_icons
      - run: flutter build windows --release
      - name: 버전 읽기
        id: ver
        shell: bash
        run: echo "v=$(grep '^version:' pubspec.yaml | sed -E 's/version:[ ]*//; s/\+.*//')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: mailchat-windows-v${{ steps.ver.outputs.v }}
          path: build/windows/x64/runner/Release
